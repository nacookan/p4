name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ビルド・バンドルは行わない（本アプリはビルド不要な静的サイト）。
      # ここではDropbox App Keyを埋め込んだ js/dropbox-config.js を生成するだけ。
      - name: Generate js/dropbox-config.js
        env:
          DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY }}
        run: node scripts/gen-dropbox-config.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
